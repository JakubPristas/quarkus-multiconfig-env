##
# Description for my.property
# @key my.property
# @dev 7
# @int 5
# @test 1
# @all 10
##
my.property.key=10

# Output path and file configuration
# target env
prop-doc.target_environment=int

# convert to array
# example: cm,env,prop
%test1.prop-doc.selected-templates=env
%test2.prop-doc.selected-templates=prop

# names for each config type
# example: config.env
prop-doc.cm.file-name=config.cm
prop-doc.env.file-name=.env
prop-doc.prop.file-name=application.properties

# description
# true/false
prop-doc.output-description=true

# output path in target folder
# example: config-files
# example: generated-sources/config-files
prop-doc.output-path=generated-sources/config-files
